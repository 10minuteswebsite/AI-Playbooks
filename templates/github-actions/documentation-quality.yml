name: Documentation quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate documentation
        run: python3 scripts/validate_docs.py
      - name: Scan for common secret patterns
        run: python3 scripts/scan_secrets.py
      - name: Test project bootstrap and handoff
        run: python3 scripts/test_project_handoff.py
